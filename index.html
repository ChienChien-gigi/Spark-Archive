<!DOCTYPE html>
<html lang="zh-TW" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 加入 Remix Icon CDN -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <title>SPARK ARCHIVE — Visual & Motion Inspiration Sanctuary</title>
  
  <!-- 引入 Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 配置 Tailwind 主題顏色與字體 -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#08080a',             /* 極致純黑背景 */
            panel: '#12151e',          /* 灰藍色面板背景 */
            card: '#181d2a',           /* 卡片背景 */
            highlightOrange: '#ff6600',/* 極少點綴用的經典亮橘色 */
            subtleGray: '#8a94a6'      /* 輔助灰 */
          },
          fontFamily: {
            serif: ['Georgia', 'serif'],
            mono: ['Courier New', 'monospace']
          }
        }
      }
    }
  </script>
  
  <style>
    /* 引入 Google Fonts 典雅字體 */
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Noto+Serif+TC:wght@300;500;700&display=swap');
    
    body {
      background-color: #08080a;
      color: #e2e8f0;
      font-family: 'Noto Serif TC', serif;
      overflow-x: hidden;
    }

    .font-cinzel { font-family: 'Cinzel', serif; }

    /* 自訂深色滾動條 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #08080a; }
    ::-webkit-scrollbar-thumb { background: #252c3d; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #ff6600; }

    /* 毛玻璃質感面板效果 */
    .glass-panel {
      background: rgba(18, 21, 30, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* 3D 視角容器 */
    .perspective-stage {
      perspective: 1200px;
      transform-style: preserve-3d;
    }

    /* 卡片滑動互動反應 */
    .scroll-target-card {
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      will-change: transform, opacity;
    }
  </style>
</head>
<body class="relative min-h-screen flex flex-col justify-between">

  <!-- 背景動態 Canvas：極簡微光懸浮粒子 -->
  <canvas id="bgCanvas" class="fixed top-0 left-0 w-full h-full pointer-events-none z-0 opacity-45"></canvas>

  <!-- 右上角：治癒系輕音樂音效控制鈕 -->
  <div class="fixed top-6 right-6 z-50 flex items-center gap-3">
    <button id="audioToggleBtn" onclick="toggleAudio()" 
      class="glass-panel px-4 py-2 rounded-full text-xs font-mono tracking-widest text-gray-300 hover:text-highlightOrange border border-gray-800 hover:border-highlightOrange/50 transition-all flex items-center gap-2">
      <span id="audioStatusDot" class="w-2 h-2 rounded-full bg-gray-500"></span>
      <span id="audioBtnText">HEALING AUDIO: OFF</span>
    </button>
  </div>

  <div>
    <!-- ========================================================= -->
    <!-- 第一階段：滿版主視覺 (100vh Fullscreen Hero Section) -->
    <!-- ========================================================= -->
    <section id="heroSection" class="relative w-full h-screen flex flex-col items-center justify-center z-10 perspective-stage overflow-hidden">
      <div id="heroContent" class="text-center px-6 transition-transform duration-75 ease-out">
        
        <!-- 極簡橘色標註點綴 -->
        <div class="inline-block px-3 py-1 mb-6 text-[10px] font-mono tracking-[0.3em] uppercase bg-highlightOrange/10 text-highlightOrange border border-highlightOrange/30 rounded-full">
          VOL. 01 — CREATIVE SANCTUARY
        </div>

        <!-- 主標題 -->
        <h1 class="font-cinzel text-5xl md:text-8xl tracking-widest text-slate-100 font-extrabold mb-4 select-none">
          SPARK &nbsp;ARCHIVE
        </h1>
        
        <p class="text-xs md:text-sm text-gray-400 tracking-[0.2em] font-light max-w-xl mx-auto mb-10 leading-relaxed">
          網頁 / 動畫 / 遊戲視覺與靈感收藏庫
        </p>

        <!-- 滾動進入按鈕 -->
        <button onclick="scrollToContent()" 
          class="group relative inline-flex items-center gap-3 px-8 py-4 glass-panel rounded-full text-xs font-mono tracking-widest text-gray-300 hover:text-white transition-all hover:border-highlightOrange/50 shadow-xl">
          <span class="w-2 h-2 rounded-full bg-highlightOrange group-hover:scale-150 transition-transform"></span>
          EXPLORE ARCHIVE
          <svg class="w-4 h-4 text-highlightOrange transform group-hover:translate-y-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
          </svg>
        </button>
      </div>

      <!-- 向下滾動指示器 -->
      <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center opacity-60 animate-pulse">
        <span class="text-[9px] font-mono tracking-widest text-gray-500 mb-2">SCROLL DOWN FOR VAULT</span>
        <div class="w-[1px] h-8 bg-gradient-to-b from-highlightOrange/80 to-transparent"></div>
      </div>
    </section>


    <!-- ========================================================= -->
    <!-- 第二階段：主要功能區與收藏庫 (下拉揭曉) -->
    <!-- ========================================================= -->
    <main id="mainContent" class="relative z-10 max-w-7xl mx-auto px-6 pb-24">

      <!-- 頂部列：每日自動更新設計思路、分類、搜尋與商業化效率工具 -->
      <header class="mb-10 glass-panel rounded-2xl p-6 border border-gray-800/80">
        
        <!-- 第一排：每日自動更新設計思維與技巧推薦 -->
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 pb-6 border-b border-gray-800/80">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="text-highlightOrange text-xs">●</span>
              <span id="dailySparkTitle" class="text-xs font-mono text-gray-400 uppercase tracking-wider">DAILY AUTOMATED DESIGN SPARK</span>
            </div>
            <p id="dailySparkText" class="text-sm md:text-base text-gray-200 font-light italic">
              "載入今日自動推薦中..."
            </p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="saveCurrentSpark()" class="px-3 py-1.5 text-xs font-mono bg-highlightOrange/10 hover:bg-highlightOrange/20 border border-highlightOrange/40 rounded-lg text-highlightOrange transition">
              <i class="ri-bookmark-fill"></i> 收藏今日靈感
            </button>
          </div>
        </div>

        <!-- 第二排：分類標籤、搜尋框與新增按鈕 -->
        <div class="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4 pt-6">
          
          <!-- 分類過濾按鈕 -->
          <div class="flex flex-wrap items-center gap-2" id="categoryTabs">
            <!-- 由 JS 動態繪製 -->
          </div>

          <!-- 搜尋輸入與手動新增連結 -->
          <div class="flex items-center gap-3">
            <div class="relative flex-1 md:w-64">
              <input type="text" id="searchInput" oninput="renderVault()" placeholder="搜尋標題、標籤、筆記..." 
                class="w-full bg-panel border border-gray-800 focus:border-highlightOrange/50 text-xs text-gray-200 px-3 py-2.5 rounded-lg outline-none font-mono transition">
            </div>
            <button onclick="openAddModal()" class="px-4 py-2.5 bg-highlightOrange text-black font-mono font-bold text-xs rounded-lg hover:bg-orange-500 transition flex items-center gap-1.5 shadow-lg shadow-highlightOrange/10">
              <span>+</span> ADD ITEM
            </button>
          </div>

        </div>
      </header>

      <!-- 收藏庫網格卡片區 (整齊擺放) -->
      <section id="vaultGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 perspective-stage">
        <!-- 收藏項目由 JavaScript 動態渲染 -->
      </section>

    </main>
  </div>


  <!-- ========================================================= -->
  <!-- 頁尾部分 (Footer) -->
  <!-- ========================================================= -->
  <footer class="relative z-10 w-full border-t border-gray-800/80 bg-bg/90 py-10 px-6 text-center font-mono text-xs text-gray-500">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="text-highlightOrange">✦</span>
        <span class="text-gray-300 font-cinzel tracking-widest">SPARK ARCHIVE &copy; 2026</span>
      </div>
      <p class="text-gray-400">專為網頁、動畫與遊戲開發者打造的靈感收集所。</p>
      <div>
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="text-gray-400 hover:text-highlightOrange transition">
          BACK TO TOP ↑
        </button>
      </div>
    </div>
  </footer>


  <!-- ========================================================= -->
  <!-- 新增與編輯共用 Modal 彈窗 -->
  <!-- ========================================================= -->
  <div id="addModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md hidden opacity-0 transition-opacity duration-200">
    <div class="glass-panel w-full max-w-lg p-6 rounded-2xl border border-gray-700/60 shadow-2xl m-4 transform scale-95 transition-transform duration-200" id="addModalContent">
      <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-3">
        <h3 id="modalTitle" class="font-cinzel text-lg tracking-wider text-slate-100 flex items-center gap-2">
          <span class="text-highlightOrange">✦</span> NEW ARCHIVE ITEM
        </h3>
        <button onclick="closeAddModal()" class="text-gray-500 hover:text-white font-mono text-sm">✕</button>
      </div>

      <!-- 表單：新增或編輯共用 -->
      <form id="addForm" onsubmit="handleFormSubmit(event)" class="space-y-4 font-mono text-xs">
        <input type="hidden" id="editItemId">
        <div>
          <label class="block text-gray-400 mb-1">標題 / 名稱</label>
          <input type="text" id="itemTitle" required placeholder="例如：ShaderToy Raymarching 筆記" class="w-full bg-panel border border-gray-800 focus:border-highlightOrange/50 text-gray-200 p-2.5 rounded-lg outline-none">
        </div>

        <div>
          <label class="block text-gray-400 mb-1">網址 (URL / IG / Threads 連結)</label>
          <input type="url" id="itemUrl" required placeholder="https://..." class="w-full bg-panel border border-gray-800 focus:border-highlightOrange/50 text-gray-200 p-2.5 rounded-lg outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-gray-400 mb-1">分類</label>
            <select id="itemCategory" class="w-full bg-panel border border-gray-800 focus:border-highlightOrange/50 text-gray-200 p-2.5 rounded-lg outline-none">
              <option value="Web Design">Web Design</option>
              <option value="Game Dev">Game Dev</option>
              <option value="Animation">Animation</option>
              <option value="Social Posts">Social (IG/Threads)</option>
              <option value="Tutorials">Tutorials & Math</option>
              <option value="Asset Spark">Asset Spark</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-400 mb-1">標籤</label>
            <input type="text" id="itemTags" placeholder="icon, Chrome, Instagram, Threads" class="w-full bg-panel border border-gray-800 focus:border-highlightOrange/50 text-gray-200 p-2.5 rounded-lg outline-none">
          </div>
        </div>

        <div>
          <label class="block text-gray-400 mb-1">備註 / 重點</label>
          <textarea id="itemNote" rows="3" placeholder="這篇貼文或網站為什麼吸引你？有什麼動畫互動值得參考？" class="w-full bg-panel border border-gray-800 focus:border-highlightOrange/50 text-gray-200 p-2.5 rounded-lg outline-none"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-800">
          <button type="button" onclick="closeAddModal()" class="px-4 py-2 text-gray-400 hover:text-white">取消</button>
          <button type="submit" id="submitBtnText" class="px-5 py-2 bg-highlightOrange text-black font-bold rounded-lg hover:bg-orange-500 transition">儲存收藏</button>
        </div>
      </form>
    </div>
  </div>


  <!-- ========================================================= -->
  <!-- 內嵌預覽 Modal 彈窗 -->
  <!-- ========================================================= -->
  <div id="previewModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md hidden opacity-0 transition-opacity duration-200">
    <div class="glass-panel w-full max-w-5xl h-[85vh] p-4 rounded-2xl border border-gray-700/60 shadow-2xl m-4 flex flex-col">
      <div class="flex justify-between items-center mb-3 px-2">
        <div class="flex items-center gap-3">
          <span id="previewCatBadge" class="text-[10px] font-mono px-2 py-0.5 rounded bg-highlightOrange/10 text-highlightOrange border border-highlightOrange/30">CATEGORY</span>
          <h3 id="previewTitle" class="font-cinzel text-base text-slate-100 truncate max-w-md">Item Title</h3>
        </div>
        <div class="flex items-center gap-2">
          <a id="previewExternalLink" href="#" target="_blank" class="px-3 py-1 bg-panel border border-gray-700 text-xs font-mono text-gray-300 hover:text-highlightOrange rounded flex items-center gap-1">
            在新分頁打開 ↗
          </a>
          <button onclick="closePreviewModal()" class="text-gray-400 hover:text-white font-mono text-sm px-2">✕</button>
        </div>
      </div>

      <!-- iFrame 預覽與安全限制備用提示 -->
      <div class="flex-1 bg-black/80 rounded-xl overflow-hidden border border-gray-800 relative">
        <iframe id="previewIframe" class="w-full h-full border-0"></iframe>
        <div id="iframeFallback" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-panel hidden">
          <p class="text-sm text-gray-400 mb-4">此網站或社交貼文設有 Cross-Origin 同源限制，無法直接在網頁內嵌入。</p>
          <a id="fallbackLink" href="#" target="_blank" class="px-5 py-2.5 bg-highlightOrange text-black font-mono font-bold text-xs rounded-lg hover:bg-orange-500 transition">
            點此開啟原始連結 ↗
          </a>
        </div>
      </div>
    </div>
  </div>


  <!-- ========================================================= -->
  <!-- JAVASCRIPT 邏輯與互動系統 (含詳細註解) -->
  <!-- ========================================================= -->
  <script>
    // --- 預設展示資料 ---
    const initialItems = [
      {
        id: '1',
        title: 'ShaderToy — Realtime GLSL Shaders',
        url: 'https://www.shadertoy.com',
        category: 'Web Design',
        tags: ['glsl', 'shaders', '3d'],
        note: '學習光線追蹤 (Raymarching) 與雜訊 (Noise) 演算法的最佳平台。',
        date: '2026-11-01'
      },
      {
        id: '2',
        title: 'Awwwards — Site of the Day',
        url: 'https://www.awwwards.com',
        category: 'Web Design',
        tags: ['inspiration', 'ui/ux', 'award'],
        note: '觀摩世界頂級網頁動畫與三維佈局互動。',
        date: '2026-11-02'
      },
      {
        id: '3',
        title: 'Instagram Creative Post',
        url: 'https://www.instagram.com/p/C_sample/',
        category: 'Social Posts',
        tags: ['ig', '哀居', '排版'],
        note: '非常吸引人的對角線視覺構圖與色彩搭配。',
        date: '2026-11-03'
      },
      {
        id: '4',
        title: 'Threads 靈感討論區',
        url: 'https://www.threads.net/@sample',
        category: 'Social Posts',
        tags: ['threads', 'Instagram', '獨立遊戲'],
        note: '關於獨立遊戲 Hitstop 打擊感處理的深度討論。',
        date: '2026-11-04'
      }
    ];

    // --- 每日自動更新的設計思維與技巧庫 (根據當天日期自動輪換) ---
    const automatedSparks = [
      { type: "網頁動態技巧", text: "今日技巧：善用 Scroll-Driven Animations API，讓縮放與旋轉直接綁定滾動進度，創造沉浸式敘事。" },
      { type: "遊戲開發思維", text: "今日思維：遊戲打擊感的核心在於「相機震動 (Screen Shake) + 停格 (Hitstop) + 殘影特效」的完美協同。" },
      { type: "色彩美學指南", text: "今日色彩：深灰暗色基底 (#08080a) 搭配極少量的亮橘色 (#ff6600) 作為焦點，能引導使用者視線直達重點。" },
      { type: "網頁效能優化", text: "今日技巧：利用 WebGL 粒子背景時，記得設定視窗不可見時暫停 requestAnimationFrame 以降低 CPU 耗能。" },
      { type: "動畫緩動曲線", text: "今日美學：過渡曲線採用 cubic-bezier(0.16, 1, 0.3, 1) 可以呈現極具高級感的絲滑加速與緩停。" },
      { type: "排版與格線系統", text: "今日設計：參考 Swiss Brutalist 風格，利用大膽的粗體字、不對稱留白與高反差線條來加強視覺張力。" },
      { type: "社群靈感收藏", text: "今日建議：在 Threads 或 IG 看到優秀的 UI 動態時，立即截圖並記錄其前 3 秒的視覺誘因。" }
    ];

    // 根據當天日期（一年中的第幾天）自動計算索引，實現每天自動更新
    function getDailySpark() {
      const now = new Date();
      const start = new Date(now.getFullYear(), 0, 0);
      const diff = (now - start) + ((start.getTimezoneOffset() - now.getTimezoneOffset()) * 60 * 1000);
      const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
      const index = dayOfYear % automatedSparks.length;
      return automatedSparks[index];
    }

    // 初始化自動更新靈感
    function initDailySpark() {
      const spark = getDailySpark();
      document.getElementById('dailySparkTitle').innerText = `DAILY AUTOMATED SPARK — [ ${spark.type} ]`;
      document.getElementById('dailySparkText').innerText = `"${spark.text}"`;
    }

    // --- 狀態變數 ---
    let items = JSON.parse(localStorage.getItem('spark_archive_items')) || initialItems;
    let currentCategory = 'ALL';
    let isAudioPlaying = false;
    let audioCtx = null;
    let synthGain = null;

    // =========================================================
    // 自訂 MP3 音樂播放引擎
    // =========================================================
    let backgroundAudio = null;

    function toggleAudio() {
      if (!backgroundAudio) {
        // 【請將下方引號內的網址或 Base64 替換成您的音樂】
        // 做法 A：如果您有托管 MP3 檔案的網址，可直接填入網址，例如：
        // const audioSrc = "https://example.com/your-music.mp3";
        
// 做法 B：如果您要使用先前轉換的 Base64 字串，請貼在這邊：
        const audioSrc = "data:audio/mpeg;base64,你的MP3_Base64字串貼在這裡"; 

        backgroundAudio = new Audio(audioSrc);
        backgroundAudio.loop = true; // 設定為循環播放
        backgroundAudio.volume = 0.6; // 預設音量 (0.0 到 1.0)
      }

      if (isAudioPlaying) {
        stopHealingMusic();
      } else {
        startHealingMusic();
      }
    }

    function startHealingMusic() {
      if (!backgroundAudio) return;
      
      backgroundAudio.play().then(() => {
        isAudioPlaying = true;
        document.getElementById('audioBtnText').innerText = "MY MUSIC: ON";
        document.getElementById('audioBtnText').classList.add('text-highlightOrange');
        document.getElementById('audioStatusDot').className = "w-2 h-2 rounded-full bg-highlightOrange animate-ping";
      }).catch(err => {
        console.error("播放失敗，請檢查音樂來源或瀏覽器自動播放限制：", err);
        alert("無法播放音訊，請確認音樂路徑或格式是否正確。");
      });
    }

    function stopHealingMusic() {
      if (backgroundAudio) {
        backgroundAudio.pause();
        backgroundAudio.currentTime = 0; // 重置播放進度
      }
      isAudioPlaying = false;
      document.getElementById('audioBtnText').innerText = "HEALING AUDIO: OFF";
      document.getElementById('audioBtnText').classList.remove('text-highlightOrange');
      document.getElementById('audioStatusDot').className = "w-2 h-2 rounded-full bg-gray-500";
    }


    // --- Canvas 背景粒子動畫 ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.8 + 0.5;
        this.speedY = -(Math.random() * 0.25 + 0.08);
        this.speedX = (Math.random() - 0.5) * 0.15;
        this.opacity = Math.random() * 0.4 + 0.15;
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        if (this.y < 0) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(255, 102, 0, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 40; i++) particles.push(new Particle());

    function animateCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateCanvas);
    }
    animateCanvas();


    // --- 捲動主視覺縮放效果 ---
    const heroContent = document.getElementById('heroContent');

    window.addEventListener('scroll', () => {
      const scrolled = window.scrollY;
      const viewportHeight = window.innerHeight;
      
      if (scrolled <= viewportHeight) {
        const progress = scrolled / viewportHeight;
        const scale = 1 - progress * 0.3; 
        const opacity = 1 - progress * 1.2;
        const translateY = progress * 100;

        heroContent.style.transform = `scale(${scale}) translateY(${translateY}px)`;
        heroContent.style.opacity = Math.max(0, opacity);
      }
    });

    function scrollToContent() {
      window.scrollTo({
        top: window.innerHeight * 0.85,
        behavior: 'smooth'
      });
    }


    // --- 收藏今日自動靈感 ---
    function saveCurrentSpark() {
      const spark = getDailySpark();
      const newItem = {
        id: Date.now().toString(),
        title: `每日設計靈感 — ${new Date().toLocaleDateString()}`,
        url: '#',
        category: 'Asset Spark',
        tags: ['spark', 'automated', spark.type],
        note: spark.text,
        date: new Date().toISOString().split('T')[0]
      };
      items.unshift(newItem);
      saveItems();
      renderVault();
      alert('已成功將今日自動靈感收藏至你的聖所中！');
    }


    // --- 收藏庫渲染與分類過濾 ---
    const categories = ['ALL', 'Web Design', 'Game Dev', 'Animation', 'Social Posts', 'Tutorials', 'Asset Spark'];

    function renderCategoryTabs() {
      const container = document.getElementById('categoryTabs');
      container.innerHTML = categories.map(cat => `
        <button onclick="setCategory('${cat}')" class="px-3 py-1.5 rounded-lg text-xs font-mono transition border ${
          currentCategory === cat 
            ? 'bg-highlightOrange/10 text-highlightOrange border-highlightOrange/50 font-bold' 
            : 'bg-panel text-gray-400 border-gray-800 hover:text-gray-200'
        }">
          ${cat}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      renderCategoryTabs();
      renderVault();
    }

    function renderVault() {
      const grid = document.getElementById('vaultGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();

      const filtered = items.filter(item => {
        const matchesCat = currentCategory === 'ALL' || item.category === currentCategory;
        const matchesSearch = item.title.toLowerCase().includes(search) || 
                              item.tags.some(t => t.toLowerCase().includes(search)) ||
                              item.note.toLowerCase().includes(search);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center text-gray-500 font-mono text-xs">
            NO ASSETS FOUND IN ARCHIVE
          </div>
        `;
        return;
      }

      // 整齊卡片渲染 (內含「編輯」與「預覽」按鈕)
      grid.innerHTML = filtered.map(item => `
        <article class="scroll-target-card glass-panel rounded-xl p-5 border border-gray-800/80 hover:border-highlightOrange/50 transition-all duration-300 flex flex-col justify-between group">
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="text-[9px] font-mono tracking-widest px-2 py-0.5 rounded bg-black/60 text-highlightOrange border border-highlightOrange/20">
                ${item.category.toUpperCase()}
              </span>
              <span class="text-[10px] font-mono text-gray-500">${item.date}</span>
            </div>

            <h4 class="font-cinzel text-base font-semibold text-slate-100 group-hover:text-highlightOrange transition-colors mb-2 line-clamp-1">
              ${item.title}
            </h4>

            <p class="text-xs text-gray-400 font-light leading-relaxed mb-4 line-clamp-3">
              ${item.note || '無附加筆記...'}
            </p>
          </div>

          <div>
            <div class="flex flex-wrap gap-1.5 mb-4">
              ${item.tags.map(t => `<span class="text-[9px] font-mono text-gray-400 bg-black/40 px-2 py-0.5 rounded border border-gray-800">#${t}</span>`).join('')}
            </div>

            <div class="flex items-center justify-between pt-3 border-t border-gray-800/80 text-xs font-mono">
              <div class="flex items-center gap-3">
                <button onclick="openPreview('${item.url}', '${encodeURIComponent(item.title)}', '${item.category}')" class="text-gray-300 hover:text-highlightOrange transition flex items-center gap-1">
                  <i class="ri-eye-line"></i> PREVIEW
                </button>
                <button onclick="openEditModal('${item.id}')" class="text-gray-400 hover:text-highlightOrange transition flex items-center gap-1">
                  <i class="ri-pencil-fill"></i> EDIT
                </button>
              </div>
              <div class="flex items-center gap-3">
                <a href="${item.url}" target="_blank" class="text-gray-400 hover:text-white transition">LINK ↗</a>
                <button onclick="deleteItem('${item.id}')" class="text-gray-600 hover:text-red-400 transition">✕</button>
              </div>
            </div>
          </div>
        </article>
      `).join('');
    }

    function saveItems() {
      localStorage.setItem('spark_archive_items', JSON.stringify(items));
    }

    function deleteItem(id) {
      if (confirm('確定刪除此收藏項目？')) {
        items = items.filter(i => i.id !== id);
        saveItems();
        renderVault();
      }
    }


    // --- 商業化與高效率功能：資料備份與還原 ---
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(items, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `spark_archive_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const fileReader = new FileReader();
      if (event.target.files[0]) {
        fileReader.readAsText(event.target.files[0], "UTF-8");
        fileReader.onload = (e) => {
          try {
            const importedItems = JSON.parse(e.target.result);
            if (Array.isArray(importedItems)) {
              items = importedItems;
              saveItems();
              renderVault();
              alert('成功匯入並更新所有收藏資料！');
            } else {
              alert('檔案格式錯誤。');
            }
          } catch (err) {
            alert('解析 JSON 檔案失敗。');
          }
        };
      }
    }


    // --- 彈窗控制 (支援新增與編輯切換) ---
    function openAddModal() {
      document.getElementById('editItemId').value = '';
      document.getElementById('modalTitle').innerHTML = '<span class="text-highlightOrange">✦</span> NEW ARCHIVE ITEM';
      document.getElementById('submitBtnText').innerText = '儲存收藏';
      document.getElementById('addForm').reset();
      
      const modal = document.getElementById('addModal');
      const content = document.getElementById('addModalContent');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        content.classList.remove('scale-95');
      }, 10);
    }

    function openEditModal(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;

      document.getElementById('editItemId').value = item.id;
      document.getElementById('itemTitle').value = item.title;
      document.getElementById('itemUrl').value = item.url;
      document.getElementById('itemCategory').value = item.category;
      document.getElementById('itemTags').value = item.tags.join(', ');
      document.getElementById('itemNote').value = item.note || '';

      document.getElementById('modalTitle').innerHTML = '<span class="text-highlightOrange">✦</span> EDIT ARCHIVE ITEM';
      document.getElementById('submitBtnText').innerText = '確認修改';

      const modal = document.getElementById('addModal');
      const content = document.getElementById('addModalContent');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        content.classList.remove('scale-95');
      }, 10);
    }

    function closeAddModal() {
      const modal = document.getElementById('addModal');
      const content = document.getElementById('addModalContent');
      modal.classList.add('opacity-0');
      content.classList.add('scale-95');
      setTimeout(() => modal.classList.add('hidden'), 200);
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('editItemId').value;
      const url = document.getElementById('itemUrl').value;
      let category = document.getElementById('itemCategory').value;
      
      // 自動辨識 Instagram / Threads貼文
      if (url.includes('instagram.com') || url.includes('threads.net')) {
        category = 'Social Posts';
      }

      const title = document.getElementById('itemTitle').value;
      const tags = document.getElementById('itemTags').value.split(',').map(t => t.trim()).filter(Boolean);
      const note = document.getElementById('itemNote').value;

      if (editId) {
        // 執行編輯更新
        items = items.map(item => {
          if (item.id === editId) {
            return { ...item, title, url, category, tags, note };
          }
          return item;
        });
      } else {
        // 執行新增項目
        const newItem = {
          id: Date.now().toString(),
          title,
          url,
          category,
          tags,
          note,
          date: new Date().toISOString().split('T')[0]
        };
        items.unshift(newItem);
      }

      saveItems();
      renderVault();
      closeAddModal();
    }


    // --- 內嵌預覽視窗控制 ---
    function openPreview(url, title, category) {
      const modal = document.getElementById('previewModal');
      const iframe = document.getElementById('previewIframe');
      const fallback = document.getElementById('iframeFallback');
      
      document.getElementById('previewTitle').innerText = decodeURIComponent(title);
      document.getElementById('previewCatBadge').innerText = category.toUpperCase();
      document.getElementById('previewExternalLink').href = url;
      document.getElementById('fallbackLink').href = url;

      if (url === '#' || url.startsWith('javascript')) {
        iframe.classList.add('hidden');
        fallback.classList.remove('hidden');
      } else {
        iframe.classList.remove('hidden');
        fallback.classList.add('hidden');
        iframe.src = url;
      }

      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    function closePreviewModal() {
      const modal = document.getElementById('previewModal');
      const iframe = document.getElementById('previewIframe');
      modal.classList.add('opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
        iframe.src = '';
      }, 200);
    }


    // --- 頁面初始化 ---
    initDailySpark();
    renderCategoryTabs();
    renderVault();
  </script>
</body>
</html>
